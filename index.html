        const overlapStart = Math.max(off.start, r.start);
        const overlapEnd = Math.min(off.end, r.end);
        if (overlapStart < overlapEnd) {
          const list = perItemRanges.get(itemIdx) || [];
          list.push({ start: overlapStart - off.start, end: overlapEnd - off.start, active: isActive });
          perItemRanges.set(itemIdx, list);
        }
      }
    });

    perItemRanges.forEach((ranges, itemIdx) => {
      const span = textDivs[itemIdx];
      const text = items[itemIdx] ? items[itemIdx].str : "";
      if (!span || !text) return;

      ranges.sort((a, b) => a.start - b.start);
      let html = "";
      let cursor = 0;
      ranges.forEach(rg => {
        if (rg.start > cursor) html += escapeHtml(text.slice(cursor, rg.start));
        const cls = "search-highlight" + (rg.active ? " search-highlight-active" : "");
        html += `<mark class="${cls}">${escapeHtml(text.slice(rg.start, rg.end))}</mark>`;
        cursor = Math.max(cursor, rg.end);
      });
      if (cursor < text.length) html += escapeHtml(text.slice(cursor));
      span.innerHTML = html;
    });
  }

  function highlightSnippet(snippet, query) {
    const escapedSnippet = escapeHtml(snippet);
    const re = buildFlexibleRegex(query, "gi");
    if (!re) return escapedSnippet;
    try {
      return escapedSnippet.replace(re, m => "<mark>" + m + "</mark>");
    } catch (e) {
      return escapedSnippet;
    }
  }

  function renderSearchResults(query) {
    searchResultsDiv.innerHTML = "";

    if (!query) {
      searchCount.textContent = "";
      const hint = document.createElement("div");
      hint.className = "search-hint";
      hint.textContent = "Escribe para buscar en todas las paginas.";
      searchResultsDiv.appendChild(hint);
      return;
    }

    if (!searchResults.length) {
      searchCount.textContent = "0";
      const empty = document.createElement("div");
      empty.className = "search-empty";
      empty.textContent = "Sin resultados.";
      searchResultsDiv.appendChild(empty);
      return;
    }

    searchCount.textContent = (searchActiveIndex + 1) + " / " + searchResults.length;

    searchResults.forEach((r, i) => {
      const item = document.createElement("div");
      item.className = "search-result-item" + (i === searchActiveIndex ? " active-match" : "");

      const pageTag = document.createElement("div");
      pageTag.className = "search-result-page";
      pageTag.textContent = "Pág. " + r.page;

      const snippetDiv = document.createElement("div");
      snippetDiv.className = "search-result-snippet";
      snippetDiv.innerHTML = highlightSnippet(r.snippet, query);

      item.appendChild(pageTag);
      item.appendChild(snippetDiv);
      item.addEventListener("click", () => goToSearchResult(i));

      searchResultsDiv.appendChild(item);
    });
  }

  function goToSearchResult(i) {
    if (!searchResults[i]) return;
    searchActiveIndex = i;
    renderSearchResults(searchInput.value.trim());

    const target = searchResults[i].page;
    if (target !== pageNum) {
      goTo(target, target > pageNum ? "next" : "prev");
    } else {
      // Ya estamos en la pagina correcta: no hace falta re-renderizar,
      // solo actualizar cual resaltado queda marcado como "activo".
      refreshHighlights();
    }

    const activeEl = searchResultsDiv.children[i];
    if (activeEl) activeEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function searchStep(delta) {
    if (!searchResults.length) return;
    let next = searchActiveIndex + delta;
    if (next < 0) next = searchResults.length - 1;
    if (next >= searchResults.length) next = 0;
    goToSearchResult(next);
  }

  searchInput.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => runSearch(searchInput.value), 250);
  });

  searchInput.addEventListener("keydown", (ev) => {
    // Evita que las teclas de navegacion del visor (flechas, +/-, 0, t)
    // se disparen mientras se esta escribiendo aca — ver el listener
    // global mas abajo, que ya chequea esto, pero ademas frenamos la
    // propagacion aca por las dudas de que algo mas este escuchando en
    // el documento.
    ev.stopPropagation();

    if (ev.key === "Enter") {
      ev.preventDefault();
      if (ev.shiftKey) searchStep(-1);
      else searchStep(1);
    }
    if (ev.key === "Escape") {
      closeSearchPanel();
    }
  });

  searchPrevBtn.addEventListener("click", () => searchStep(-1));
  searchNextBtn.addEventListener("click", () => searchStep(1));

  function openSearchPanel() {
    thumbPanel.classList.remove("visible");
    btnThumbnails.classList.remove("active");
    closeChaptersPanel();
    searchPanel.classList.add("visible");
    btnSearch.classList.add("active");
    renderSearchResults(searchInput.value.trim());
    setTimeout(() => searchInput.focus(), 50);
  }

  function closeSearchPanel() {
    searchPanel.classList.remove("visible");
    btnSearch.classList.remove("active");

    // Al cerrar el buscador se "deselecciona": se limpia la consulta,
    // los resultados y el resaltado que haya quedado pintado sobre el
    // texto de la pagina actual, asi no queda nada marcado de una
    // busqueda anterior.
    clearTimeout(searchDebounceTimer);
    currentSearchQuery = "";
    searchResults = [];
    searchActiveIndex = -1;
    searchInput.value = "";
    searchCount.textContent = "";
    searchResultsDiv.innerHTML = "";
    refreshHighlights();
  }

  btnSearch.addEventListener("click", () => {
    if (searchPanel.classList.contains("visible")) closeSearchPanel();
    else openSearchPanel();
  });

  // =====================================================================
  // PANTALLA COMPLETA — usa la Fullscreen API estandar (con prefijos por
  // si acaso). Se activa y se DESACTIVA "de forma intencional" unicamente
  // haciendo click en el icono de la barra superior (toggleFullscreen).
  // Si el navegador sale de fullscreen por su cuenta al presionar Escape,
  // el listener de Escape (mas arriba) detecta ese cierre "no intencional"
  // y vuelve a pedir fullscreen enseguida — ver fullscreenExitViaButton.
  //
  // OJO: como este visor normalmente vive dentro de un <iframe> embebido
  // en Cargo, para que esto funcione ahi el iframe que lo contiene
  // necesita el atributo "allowfullscreen" (o allow="fullscreen"). Si el
  // sitio que lo embebe no lo tiene, el navegador va a bloquear el
  // pedido silenciosamente.
  // =====================================================================
  function toggleFullscreen() {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!isFs) {
      const target = document.documentElement;
      const req = target.requestFullscreen || target.webkitRequestFullscreen ||
                  target.mozRequestFullScreen || target.msRequestFullscreen;
      if (req) req.call(target).catch(() => {});
    } else {
      // Marca que esta salida es intencional (boton), para que el
      // listener de Escape no intente re-forzar el fullscreen despues.
      fullscreenExitViaButton = true;
      const exit = document.exitFullscreen || document.webkitExitFullscreen ||
                    document.mozCancelFullScreen || document.msExitFullscreen;
      if (exit) exit.call(document).catch ? exit.call(document).catch(() => {}) : exit.call(document);
    }
  }

  function syncFullscreenBtn() {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    btnFullscreen.classList.toggle("active", isFs);
  }

  btnFullscreen.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", syncFullscreenBtn);
  document.addEventListener("webkitfullscreenchange", syncFullscreenBtn);

  function resetPosition() {
    pos = { x: 0, y: 0 };
    panLayer.style.transition = "none";
    panLayer.style.transform = "translate3d(0,0,0)";
    panLayer.style.opacity = "1";
  }

  // =====================================================================
  // ANIMACION DE "PASAR PAGINA" (hecha a mano, sin librerias externas)
  // =====================================================================
  // En modo UNA pagina, toda la vista es una sola hoja, asi que la que
  // gira es #pan-layer entero (como antes).
  //
  // En modo DOS paginas, si giraramos #pan-layer entero (que contiene
  // las dos hojas juntas) el spread se veria como si fuera una unica
  // placa plana doblandose por la mitad — no como pasar una pagina de
  // un libro. Para que se vea bien, en modo doble SOLO gira la hoja que
  // corresponde:
  //   - "next": gira la hoja de la DERECHA (leaf-2), con bisagra en su
  //     propio borde izquierdo (el lomo del libro), como si esa pagina
  //     se cerrara hacia la izquierda tapando la otra.
  //   - "prev": gira la hoja de la IZQUIERDA (leaf-1), con bisagra en
  //     su propio borde derecho, cerrandose hacia la derecha.
  // La otra hoja del spread (la "companera") no gira en 3D — solo recibe
  // un leve fundido de opacidad + escala sincronizado con el flip de la
  // que si gira, para que su cambio de contenido no aparezca como un
  // "pop" seco, sin que eso agregue una segunda animacion 3D pesada.
  function getFlipTarget(dir) {
    if (!twoPageMode) {
      return {
        el: panLayer,
        shade: shade1,
        companion: null,
        companionShade: null,
        outOrigin: dir === "next" ? "0% 50%" : "100% 50%",
        outRotate: dir === "next" ? "-130deg" : "130deg",
        inOrigin: dir === "next" ? "100% 50%" : "0% 50%",
        inRotate: dir === "next" ? "110deg" : "-110deg"
      };
    }
    if (dir === "next") {
      return {
        el: leaf2, shade: shade2, companion: leaf1, companionShade: shade1,
        outOrigin: "0% 50%", outRotate: "-130deg", inOrigin: "100% 50%", inRotate: "110deg"
      };
    }
    return {
      el: leaf1, shade: shade1, companion: leaf2, companionShade: shade2,
      outOrigin: "100% 50%", outRotate: "130deg", inOrigin: "0% 50%", inRotate: "-110deg"
    };
  }

  async function goTo(num, dir) {
    if (!pdfDoc || animating) return;
    if (num < 1 || num > pdfDoc.numPages) return;
    animating = true;

    // FIX: si el cursor estaba flotando sobre un hyperlink cuando se
    // pasa de pagina (con las flechitas, el teclado, un resultado de
    // busqueda, etc.), el <a> correspondiente va a ser destruido y
    // reconstruido por renderAnnotationLayer() sin que el navegador
    // dispare "mouseleave" sobre el — asi es como el tooltip de preview
    // se quedaba pegado en pantalla ("permanente"). Ocultarlo aca,
    // apenas arranca la navegacion, asegura que nunca quede huerfano.
    hideLinkPreview();

    const target = getFlipTarget(dir);
    const el = target.el;
    const shade = target.shade;
    const companion = target.companion;
    const isWholeLayer = el === panLayer;

    if (!isWholeLayer) el.style.zIndex = "5";

    // Precarga en paralelo el/los destino(s) mientras arranca la
    // animacion de salida, asi el instante del "swap" (cuando la hoja
    // esta de canto) nunca tiene que esperar a pdf.js — esa espera a
    // mitad de la animacion era la causa de los freezes/stutter, sobre
    // todo la primera vez que se visita una pagina lejana o en modo 2
    // paginas (2 canvases a renderizar en vez de 1).
    const preloadNums = twoPageMode ? [num, num + 1] : [num];
    const preloadPromise = Promise.all(
      preloadNums
        .filter(n => n >= 1 && n <= pdfDoc.numPages)
        .map(n => getRenderedPage(n, scale).catch(() => {}))
    );

    // Fase de salida: la hoja que corresponde se "cierra" girando sobre
    // su propio lomo, con un leve achique. La sombra de la hoja al
    // doblarse se simula con el div .flip-shade (opacity, barato) en vez
    // de un filter:brightness sobre el canvas (caro de repintar).
    el.style.transformOrigin = target.outOrigin;
    el.style.transition = "transform 0.36s cubic-bezier(0.6,0.04,0.98,0.34), opacity 0.34s ease";
    el.style.transform = `rotateY(${target.outRotate}) scale3d(0.94,0.94,1)`;
    el.style.opacity = "0.15";
    if (shade) {
      shade.style.transition = "opacity 0.36s ease";
      shade.style.opacity = "0.45";
    }
    if (companion) {
      companion.style.transition = "opacity 0.3s ease, transform 0.3s ease";
      companion.style.transform = "scale3d(0.985,0.985,1)";
      companion.style.opacity = "0.55";
    }

    await Promise.all([new Promise(r => setTimeout(r, 360)), preloadPromise]);

    pageNum = num;

    // La hoja entrante arranca doblada desde el borde opuesto (como si
    // viniera "de atras" del libro) y se despliega hasta quedar plana.
    el.style.transition = "none";
    el.style.transformOrigin = target.inOrigin;
    el.style.transform = `rotateY(${target.inRotate}) scale3d(0.94,0.94,1)`;
    el.style.opacity = "0.15";

    // Actualiza el contenido (ambas hojas si es modo doble) mientras la
    // hoja que gira esta de canto — es el momento en que menos se nota
    // el cambio de contenido, y como ya se precargo arriba, esto ahora
    // resuelve casi al instante en vez de trabar la animacion.
    await renderPage(pageNum);

    requestAnimationFrame(() => {
      el.style.transition = "transform 0.4s cubic-bezier(0.22,0.61,0.36,1), opacity 0.36s ease";
      el.style.transform = "rotateY(0deg) scale3d(1,1,1)";
      el.style.opacity = "1";
      if (shade) {
        shade.style.transition = "opacity 0.4s ease";
        shade.style.opacity = "0";
      }
      if (companion) {
        companion.style.transition = "opacity 0.36s ease, transform 0.36s ease";
        companion.style.transform = "scale3d(1,1,1)";
        companion.style.opacity = "1";
      }
      setTimeout(() => {
        animating = false;
        el.style.transformOrigin = "50% 50%";
        if (!isWholeLayer) el.style.zIndex = "";
      }, 400);
    });
  }

  // =====================================================================
  // TOGGLE MODO 2 PAGINAS — muestra la pagina actual y la siguiente lado
  // a lado, tipo libro/web-archive. La navegacion "siguiente/anterior"
  // en este modo avanza de a 2 paginas.
  // =====================================================================
  function resetLeafTransform(el) {
    el.style.transition = "none";
    el.style.transform = "";
    el.style.transformOrigin = "50% 50%";
    el.style.opacity = "1";
    el.style.zIndex = "";
    const shade = el.querySelector(".flip-shade");
    if (shade) {
      shade.style.transition = "none";
      shade.style.opacity = "0";
    }
  }

  function setTwoPageMode(on) {
    twoPageMode = on;
    btnTwoPage.classList.toggle("active", on);
    resetLeafTransform(leaf1);
    resetLeafTransform(leaf2);
    leaf2.style.display = on ? "block" : "none";
    if (on) {
      // Alinea al inicio de un "spread" par para que el libro quede
      // prolijo (pagina 1 sola tipo portada, 2-3 juntas, etc).
      if (pageNum % 2 === 0 && pageNum > 1) pageNum -= 1;
      renderPage(pageNum);
    } else {
      wrap2.style.visibility = "hidden";
    }
  }

  btnTwoPage.addEventListener("click", () => setTwoPageMode(!twoPageMode));

  function cancelWheelPreview() {
    if (wheelPreviewRAF !== null) {
      cancelAnimationFrame(wheelPreviewRAF);
      wheelPreviewRAF = null;
    }
    pendingWheelScale = null;
  }

  function zoomBy(delta) {
    clearTimeout(wheelDebounceTimer);
    wheelDebounceTimer = null;
    cancelWheelPreview();
    zoomAnchor = null;
    scale = Math.max(baseScale * 0.5, Math.min(baseScale * 5, scale + delta));
    renderPage(pageNum);
  }

  function resetZoom() {
    clearTimeout(wheelDebounceTimer);
    wheelDebounceTimer = null;
    cancelWheelPreview();
    zoomAnchor = null;
    scale = baseScale;
    resetPosition();
    renderPage(pageNum);
  }

  function zoomByWheel(e, delta) {
    const newScale = Math.max(baseScale * 0.5, Math.min(baseScale * 5, scale + delta));
    if (newScale === scale) return;

    if (!wheelDebounceTimer) {
      const rect = canvas.getBoundingClientRect();
      const viewerRect = viewer.getBoundingClientRect();
      zoomAnchor = {
        originXpct: (e.clientX - rect.left) / rect.width,
        originYpct: (e.clientY - rect.top) / rect.height,
        cursorX: e.clientX,
        cursorY: e.clientY,
        centerX: viewerRect.left + viewerRect.width / 2,
        centerY: viewerRect.top + viewerRect.height / 2
      };
      wrap.style.transformOrigin = `${zoomAnchor.originXpct * 100}% ${zoomAnchor.originYpct * 100}%`;
    }

    scale = newScale;
    pendingWheelScale = scale / lastRenderedScale;
    zoomInfo.textContent = Math.round((scale / baseScale) * 100) + "%";

    if (wheelPreviewRAF === null) {
      wheelPreviewRAF = requestAnimationFrame(() => {
        wheelPreviewRAF = null;
        if (pendingWheelScale !== null) {
          wrap.style.transition = "none";
          wrap.style.transform = `scale3d(${pendingWheelScale}, ${pendingWheelScale}, 1)`;
          pendingWheelScale = null;
        }
      });
    }

    clearTimeout(wheelDebounceTimer);
    wheelDebounceTimer = setTimeout(() => {
      wheelDebounceTimer = null;
      renderPage(pageNum);
    }, 120);
  }

  async function loadPdf() {
    try {
      pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
      const page = await pdfDoc.getPage(1);
      baseScale = calcBaseScale(page);
      scale = baseScale;
      lastRenderedScale = baseScale;
      await renderPage(1);
      loader.classList.add("hidden");
    } catch (err) {
      loader.classList.add("hidden");
      errorBox.style.display = "flex";
      errorBox.textContent = "No se pudo cargar el PDF. Revisa la URL o, si estas usando el modo GitHub, que el repositorio sea publico y la ruta del archivo sea correcta. (" + (err && err.message ? err.message : err) + ")";
    }
  }

  loadPdf();

  // NAV
  function stepSize() { return twoPageMode ? 2 : 1; }

  document.getElementById("btn-prev").onclick = () => goTo(pageNum - stepSize(), "prev");
  document.getElementById("btn-next").onclick = () => goTo(pageNum + stepSize(), "next");
  document.getElementById("zone-prev").onclick = () => goTo(pageNum - stepSize(), "prev");
  document.getElementById("zone-next").onclick = () => goTo(pageNum + stepSize(), "next");

  // ZOOM
  document.getElementById("btn-zoom-in").onclick = () => zoomBy(baseScale * 0.25);
  document.getElementById("btn-zoom-out").onclick = () => zoomBy(-baseScale * 0.25);
  document.getElementById("btn-reset").onclick = resetZoom;

  // SCROLL ZOOM TOGGLE
  document.getElementById("btn-scroll-zoom").onclick = function() {
    scrollZoom = !scrollZoom;
    this.classList.toggle("active", scrollZoom);
  };

  // DRAG TOGGLE
  document.getElementById("btn-drag").onclick = function() {
    dragMode = !dragMode;
    this.classList.toggle("active", dragMode);
    viewer.style.cursor = dragMode ? "grab" : "default";
  };

  // SCROLL (zoom con ruedita)
  viewer.addEventListener("wheel", e => {
    if (!scrollZoom) return;
    e.preventDefault();
    zoomByWheel(e, e.deltaY < 0 ? baseScale * 0.12 : -baseScale * 0.12);
  }, { passive: false });

  // -------------------------------------------------------------------
  // DRAG (arreglado)
  // -------------------------------------------------------------------
  // ANTES: usaba mousedown/mousemove/mouseup en "window". El problema es
  // que este visor vive dentro de un <iframe> (Cargo). Si arrastras y
  // sueltas el boton del mouse FUERA del iframe (sobre el resto de tu
  // pagina), el "mouseup" nunca llega a este documento, entonces
  // "dragging" queda pegado en true y el pointer-events:none que le
  // pusimos al texto/links durante el drag nunca se revierte. Asi
  // quedaba "roto" el texto seleccionable hasta recargar la pagina.
  //
  // AHORA: usamos Pointer Events + setPointerCapture. Con la captura,
  // el navegador sigue mandando los eventos de pointer al elemento que
  // inicio el drag aunque el cursor salga del iframe, asi que el
  // "pointerup" (o "pointercancel") SIEMPRE llega, sin importar donde
  // se suelte el mouse. Ademas se agregan un par de redes de seguridad
  // extra (blur de la ventana, mouseleave del documento, cambio de
  // visibilidad) por si el navegador no soporta bien la captura en ese
  // contexto embebido.
  // -------------------------------------------------------------------

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (dragRAF !== null) {
      cancelAnimationFrame(dragRAF);
      dragRAF = null;
    }
    pendingPan = null;
    if (dragMode) viewer.style.cursor = "grab";
    ensureLayersInteractive();
    if (activePointerId !== null) {
      try { viewer.releasePointerCapture(activePointerId); } catch (e) {}
      activePointerId = null;
    }
  }

  viewer.addEventListener("pointerdown", e => {
    if (!dragMode) return;
    dragging = true;
    activePointerId = e.pointerId;
    try { viewer.setPointerCapture(e.pointerId); } catch (err) {}
    viewer.style.cursor = "grabbing";
    start.x = e.clientX - pos.x;
    start.y = e.clientY - pos.y;
    textLayerDiv.style.pointerEvents = "none";
    annotationLayerDiv.style.pointerEvents = "none";
  });

  // El pointermove puede dispararse muchas mas veces por segundo de lo
  // que el navegador realmente pinta. Si escribimos el transform en
  // cada uno, se acumula trabajo de estilo que el navegador no llega a
  // absorber a tiempo y eso se percibe como tartamudeo. Aca solo
  // guardamos la posicion mas reciente ("pendingPan") y un unico
  // requestAnimationFrame por vuelo se encarga de pintarla — como
  // maximo una actualizacion visual por frame, sincronizada con el
  // refresco real de la pantalla.
  viewer.addEventListener("pointermove", e => {
    if (!dragging || !dragMode) return;
    pendingPan = {
      x: e.clientX - start.x,
      y: e.clientY - start.y
    };
    if (dragRAF === null) {
      dragRAF = requestAnimationFrame(() => {
        dragRAF = null;
        if (pendingPan) {
          applyPan(pendingPan.x, pendingPan.y);
          pendingPan = null;
        }
      });
    }
  });

  viewer.addEventListener("pointerup", endDrag);
  viewer.addEventListener("pointercancel", endDrag);

  // Redes de seguridad extra: si por algun motivo el pointerup/pointercancel
  // no llega, cualquiera de estos eventos fuerza el cierre del drag y
  // restaura el texto/links seleccionables.
  window.addEventListener("blur", endDrag);
  document.addEventListener("mouseleave", endDrag);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) endDrag();
  });

  // DOBLE CLICK (solo si no hay seleccion de texto activa)
  viewer.addEventListener("dblclick", () => {
    const sel = window.getSelection();
    if (sel && sel.toString().length > 0) return;
    resetZoom();
  });

  // TECLADO
  document.addEventListener("keydown", e => {
    // No disparar ningun hotkey del visor mientras se esta escribiendo
    // en un campo de texto (el buscador, o cualquier otro input/textarea
    // que pueda existir). Sin esto, escribir "hola" en el buscador
    // tambien movia paginas (por la "h") o hacia zoom (por la "0").
    const activeTag = document.activeElement && document.activeElement.tagName;
    if (activeTag === "INPUT" || activeTag === "TEXTAREA" || (document.activeElement && document.activeElement.isContentEditable)) {
      return;
    }

    // FIX: si hay un overlay abierto (imagen, video, iframe, o el mini
    // visor de PDF), las flechitas deben controlar ESE overlay y no el
    // PDF principal que quedo de fondo. Si el overlay es el mini visor
    // de PDF, las flechas pasan/retroceden sus paginas; para cualquier
    // otro tipo de overlay (imagen, video, iframe), simplemente se
    // bloquea la navegacion del visor principal, ya que no tiene
    // sentido pasar de pagina detras de un overlay abierto.
    if (embedOverlay.classList.contains("visible")) {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        e.preventDefault();
        if (miniPdfNextHandler) miniPdfNextHandler();
        return;
      }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        if (miniPdfPrevHandler) miniPdfPrevHandler();
        return;
      }
      // Cualquier otra tecla de navegacion (zoom, reset, miniaturas)
      // tampoco debe afectar al visor de fondo mientras el overlay
      // esta abierto.
      if (e.key === "+" || e.key === "-" || e.key === "0" || e.key.toLowerCase() === "t") {
        return;
      }
    }

    if (e.key === "ArrowRight" || e.key === "ArrowDown") goTo(pageNum + stepSize(), "next");
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") goTo(pageNum - stepSize(), "prev");
    if (e.key === "+") zoomBy(baseScale * 0.25);
    if (e.key === "-") zoomBy(-baseScale * 0.25);
    if (e.key === "0") resetZoom();
    if (e.key.toLowerCase() === "t") btnThumbnails.click();
  });

  // RESIZE
  window.addEventListener("resize", async () => {
    if (!pdfDoc) return;
    clearTimeout(wheelDebounceTimer);
    wheelDebounceTimer = null;
    cancelWheelPreview();
    zoomAnchor = null;
    const page = await pdfDoc.getPage(pageNum);
    baseScale = calcBaseScale(page);
    scale = baseScale;
    resetPosition();
    renderPage(pageNum);
  });

</script>
</body>
</html>
